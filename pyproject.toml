[project]
name = "nekro-plugin-onebot-animated-emoji"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["poethepoet>=0.29", "ruff>=0.9"]

[tool.poe.tasks]
lint = "ruff check ."

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
